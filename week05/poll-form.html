<link rel="stylesheet" href="styles/poll-form.css" />
<header>"WDD 130 | HTML Form - User Poll"</header>

<main>
    <form>
        <div class="form-item column1">
            <h1>
                <label for="full name">Fullname</label>
                <input type="full name" id="fullname" name="fullname" required>
            </h1>
        </div>
        <div class="form-item column2">
            <h2>
                <label for="email">Useremail</label>
                <input type="email" id="useremail" name="useremail" required>
            </h2>
        </div>


        <label for="quntity">Choose your favorite browser</label>
        <select name="quantity" id="quantity">
            <option value="1">Other</option>
            <option value="2">Chrome</option>
            <option value="3">Firefox</option>
            <option value="4">Explorer</option>

        </select>
        <label><input type="checkbox" id="newsletter"> Do you have a household pet?</label>
        <label for="message">List the places you have lived</label>
        <textarea id="message" name="message" rows="4"></textarea>
        <button type="Submit">Submit Poll</button>

    </form>
</main>
<footer></footer>
