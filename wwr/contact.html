<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us and the rafting company name</title>
    <meta name="author" content="Joseph Lloyd Costner">
    <meta name="description"
        content="This website is known as contact, providing services such as setting up apointments and information.">
    <link rel="stylesheet" href="styles/rafting.css" />
</head>

<body>

    <header>
        <img src="images/z-wwr-crossedoars.png" alt="Whitewater Rafting">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>



        <div class="contact">
            <h1>San Juan Water Rafting</h1>
            <p>123 River Street</p>
            <p>Farmington, New Mexico</p>
            <p>1-234-567-8910</p>
            <p>info@sanjuanwaters.com</p>
        </div>
        <div class="map">
            <img src="images/map-of-san-juan.jpg" alt="Map of San Juan">
        </div>
        <form>
            <div class="form item">

                <label for="name">Name</label>
                <input type="text" id="name" name="name">
                <label for="email">Email</label>
                <input type="text" id="email" name="email">
                <label for="Purpose">Message Purpose</label>
                <label><input type="radio" id="Inquiry" name="employee">General Inquiry</label>
                <label><input type="radio" id="Question" name="employee">Reservation
                    Question</label>
                <label><input type="radio" id="Suggestion" name="employee">Website Suggestion</label>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="3"></textarea>
                <label><input type="checkbox" id="newsletter" name="newsletter">Please subscribe me to the monthly
                    newsletter</label>
                <button type="submit">Send message</button>
            </div>
        </form>

        <div class="serve">
            <table>
                <tr>
                    <th>We are here to serve you</th>
                </tr>
                <tr>


                    <td> <img src="images/person-1.jpg" alt="Joseph the first">
                        Joseph the first
                    </td>
                    <td><img src="images/person-2.jpg" alt="Joseph the second">
                        Joseph the second</td>

                    <td><img src="images/person-3.jpg" alt="Joseph the third">
                        Joseph the third</td>



                </tr>
            </table>

        </div>
    </main>
    <footer>
        <p>©️ 2025 🚣🏻‍♂️ San Juan Water Rafting 🚣🏻‍♂️ Joseph Lloyd Costner</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-logo.jpg" alt="Facebook Icon">
            </a>
            <a href="https://pintrist.com">
                <img src="images/brand-guidelines.jpg" alt="Pintrist Icon">
            </a>
            <a href="https://twitter.com">
                <img src="images/twitter.jpg" alt="Twitter icon">
            </a>
        </nav>
    </footer>
</body>

</html>
